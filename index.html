<!DOCTYPE html>
<html>
<head>
    <title>Community Crime Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>
    <div id="map"></div>
    
    <div id="controls">
        <button id="reportCrimeBtn">Report Crime</button>
    </div>
    
    <div id="crimeForm">
        <h3>Report a Crime</h3>
        <label for="crimeType">Crime Type:</label>
        <select id="crimeType">
            <option value="theft">Theft</option>
            <option value="vandalism">Vandalism</option>
            <option value="assault">Assault</option>
            <option value="burglary">Burglary</option>
            <option value="other">Other</option>
        </select>
        
        <label for="crimeDate">Date:</label>
        <input type="date" id="crimeDate">
        
        <label for="crimeDescription">Description:</label>
        <textarea id="crimeDescription" rows="4"></textarea>
        
        <button id="submitCrime">Submit Report</button>
        <button id="cancelReport">Cancel</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    
    <script>
       
    </script>
</body>
</html>
